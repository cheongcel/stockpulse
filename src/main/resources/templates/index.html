<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StockPulse</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #fff; }

        .ticker-wrap {
            width: 100vw;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
            background: #0a0a0a;
            padding: 13px 0;
        }
        .ticker-track {
            display: flex;
            white-space: nowrap;
            width: max-content;
            animation: ticker 35s linear infinite;
        }
        .ticker-item {
            font-size: 13px;
            color: #e0e0e0;
            padding: 0 40px;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }
        .ticker-sep { color: #444; padding: 0; flex-shrink: 0; }
        @keyframes ticker {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .main {
            max-width: 860px;
            margin: 0 auto;
            padding: 3rem 2.5rem 3rem;
        }

        .wordmark {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .wordmark-pulse {
            width: 11px; height: 11px; border-radius: 50%;
            background: #378ADD;
            animation: blink 1.8s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.35; transform: scale(0.6); }
        }
        h1 {
            font-size: 56px;
            font-weight: 500;
            color: #111;
            letter-spacing: -2.5px;
            line-height: 1;
        }
        h1 span { color: #378ADD; }

        .tagline {
            font-size: 13px;
            color: #888;
            margin-left: 23px;
            margin-bottom: 2.5rem;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: #aaa;
            margin-bottom: 14px;
        }

        .form-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .form-stack input {
            font-size: 12px;
            border: 0.5px solid #ccc;
            border-radius: 0;
            padding: 9px 12px;
            background: #fff;
            color: #111;
            outline: none;
            display: block;
        }
        .form-stack input:focus { border-color: #378ADD; }
        .input-short { width: 100%; max-width: 260px; }
        .input-long  { width: 100%; max-width: 340px; }

        .submit-btn {
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            padding: 8px 22px;
            background: #0a0a0a;
            color: #fff;
            border: none;
            border-radius: 0;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.03em;
        }
        .submit-btn:hover { background: #2a2a2a; }

        hr.divider {
            border: none;
            border-top: 0.5px solid #e5e5e5;
            margin: 2.5rem 0;
        }

        /* ── 토스트 메시지 ── */
        .toast {
            display: none;
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a0a0a;
            color: #fff;
            font-size: 12px;
            padding: 10px 20px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .toast.show {
            display: block;
            opacity: 1;
        }

        /* ── 로딩 오버레이 ── */
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.85);
            z-index: 998;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .loading-overlay.show { display: flex; }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2.5px solid #e5e5e5;
            border-top-color: #378ADD;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 12px;
            color: #888;
            letter-spacing: 0.04em;
        }

        /* ── 모바일 대응 ── */
        @media (max-width: 600px) {
            .main { padding: 2rem 1.25rem 2.5rem; }

            h1 { font-size: 38px; letter-spacing: -1.6px; }
            .wordmark { gap: 9px; }
            .wordmark-pulse { width: 9px; height: 9px; }
            .tagline {
                font-size: 12px;
                margin-left: 18px;
                margin-bottom: 2rem;
            }

            /* 터치하기 쉽도록 입력창·버튼을 키우고 전체 너비로 */
            .form-stack input {
                width: 100%;
                font-size: 16px; /* iOS에서 입력 시 자동 확대되는 것 방지 */
                padding: 12px 14px;
            }
            .btn-row { flex-direction: column; }
            .submit-btn {
                width: 100%;
                justify-content: center;
                padding: 13px 22px;
                font-size: 13px;
            }

            .ticker-item { font-size: 11px; padding: 0 24px; }
            .ticker-wrap { padding: 10px 0; }

            .toast {
                left: 16px;
                right: 16px;
                transform: none;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<!-- 토스트 메시지 -->
<div class="toast" id="toast"></div>

<!-- 로딩 오버레이 -->
<div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <p class="loading-text">AI가 뉴스를 분석하고 있어요...</p>
</div>

<div class="ticker-wrap">
    <div class="ticker-track" id="top-track"></div>
</div>

<div class="main">
    <div class="wordmark">
        <div class="wordmark-pulse"></div>
        <h1>Stock<span>Pulse</span></h1>
    </div>
    <p class="tagline">관심 키워드의 최신 뉴스를 매일 아침 요약해서 이메일로 보내드려요</p>

    <!-- Thymeleaf 메시지 → JS 토스트로 전달 -->
    <span id="server-msg" th:text="${successMsg}" style="display:none"></span>

    <p class="section-label">키워드 구독</p>
    <form th:action="@{/subscribe}" method="post">
        <div class="form-stack">
            <input class="input-short" type="text" name="keyword" id="keyword-input"
                   placeholder="키워드 (예: 삼성전자, 비트코인, 금리)" maxlength="30" required/>
            <input class="input-long" type="email" name="email"
                   placeholder="이메일 주소" required/>
        </div>
        <div class="btn-row" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;">
            <button type="submit" class="submit-btn">구독하기</button>
            <button type="button" class="submit-btn" style="background:#fff; color:#0a0a0a; border:0.5px solid #ccc;"
                    onclick="goAnalyze()">AI 분석 보기</button>
        </div>
        <p style="font-size:11px; color:#aaa; margin-top:10px;">
            구독하기를 누르면 입력한 이메일로 확인 메일이 발송돼요. 메일 속 링크를 눌러야 다이제스트가 시작되고,
            구독 해지도 다이제스트 이메일에 담긴 링크로 언제든 할 수 있어요.
        </p>
    </form>
</div>

<script>
    function goAnalyze() {
        const kw = document.getElementById('keyword-input').value.trim();
        if (!kw) { alert('키워드를 먼저 입력해주세요.'); return; }
        showLoading();
        window.location.href = '/analyze/' + encodeURIComponent(kw);
    }
</script>

<div class="ticker-wrap">
    <div class="ticker-track" id="bottom-track"></div>
</div>

<script>
    // 토스트 메시지
    const msg = document.getElementById('server-msg').textContent.trim();
    if (msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.classList.remove('show'), 300);
        }, 2500);
    }

    function showLoading() {
        document.getElementById('loading-overlay').classList.add('show');
    }

    const TOP = [
        "StockPulse — 키워드 뉴스 구독 · 요약 이메일 서비스",
        "관심 키워드를 등록하면 매일 아침 뉴스 요약을 보내드려요",
        "삼성전자 · 비트코인 · 금리 · 환율 — 원하는 키워드 구독",
        "네이버 뉴스 기반 키워드별 최신 기사 요약",
    ];
    const BOT = [
        "기사별 한 줄 요약 + 원문 링크로 빠르게 확인하세요",
        "구독 확인 이메일의 링크를 눌러야 다이제스트가 시작돼요",
        "구독 해지는 다이제스트 이메일 속 링크로 언제든 가능해요",
        "네이버 뉴스 기반 실시간 키워드 검색 서비스",
    ];

    function build(items) {
        const pool = [...items, ...items, ...items, ...items, ...items, ...items];
        return pool.map(t =>
            `<span class="ticker-item">${t}</span><span class="ticker-sep">—</span>`
        ).join('');
    }

    document.getElementById('top-track').innerHTML = build(TOP);
    document.getElementById('bottom-track').innerHTML = build(BOT);
</script>
</body>
</html>
